<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#050706"/>
    </radialGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e8c2"/>
      <stop offset="100%" stop-color="#8ab87a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <text x="50" y="62" font-family="Georgia, serif" font-size="44" font-weight="700" fill="url(#txt)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">LYP</text>
</svg>
